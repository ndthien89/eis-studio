# EIS Studio theme - modelled on Apple's Human Interface Guidelines:
# system font (SF Pro on Apple devices), system colours, generous radii,
# pill-shaped buttons, quiet borders, full light + dark appearance.

[server]
maxUploadSize = 50          # MB per file
headless = true
enableXsrfProtection = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"

[theme]
font = '-apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", Inter, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif'
headingFont = '-apple-system, BlinkMacSystemFont, "SF Pro Display", Inter, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif'
codeFont = '"SF Mono", ui-monospace, Menlo, Consolas, monospace'
baseFontSize = 15
baseRadius = "0.75rem"
buttonRadius = "full"
headingFontWeights = [700, 600, 600, 600, 600, 600]
showWidgetBorder = false
showSidebarBorder = true
chartCategoricalColors = ["#007AFF", "#FF9500", "#34C759", "#AF52DE", "#FF2D55", "#5AC8FA", "#5856D6", "#FFCC00", "#FF3B30", "#A2845E"]

[theme.light]
primaryColor = "#007AFF"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F2F2F7"
textColor = "#1D1D1F"
borderColor = "#E5E5EA"
linkColor = "#0066CC"
redColor = "#FF3B30"
orangeColor = "#FF9500"
yellowColor = "#FFCC00"
greenColor = "#34C759"
blueColor = "#007AFF"
violetColor = "#AF52DE"
grayColor = "#8E8E93"
dataframeHeaderBackgroundColor = "#F5F5F7"

[theme.light.sidebar]
backgroundColor = "#F5F5F7"
secondaryBackgroundColor = "#FFFFFF"

[theme.dark]
primaryColor = "#0A84FF"
backgroundColor = "#000000"
secondaryBackgroundColor = "#1C1C1E"
textColor = "#F5F5F7"
borderColor = "#38383A"
linkColor = "#2997FF"
redColor = "#FF453A"
orangeColor = "#FF9F0A"
yellowColor = "#FFD60A"
greenColor = "#30D158"
blueColor = "#0A84FF"
violetColor = "#BF5AF2"
grayColor = "#98989D"
dataframeHeaderBackgroundColor = "#1C1C1E"

[theme.dark.sidebar]
backgroundColor = "#111113"
secondaryBackgroundColor = "#2C2C2E"
